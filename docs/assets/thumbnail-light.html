<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1920px;height:1080px;overflow:hidden;background:#dceeff;position:relative;
    font-family:'Noto Sans KR','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  .glow{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:1500px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,94,0,.18),transparent 60%)}
  .obj{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%)}
  .key{position:absolute;left:0;right:0;bottom:176px;text-align:center;
    font-size:132px;font-weight:900;color:#10233a;letter-spacing:-.035em;line-height:1}
  .brand{position:absolute;left:0;right:0;bottom:104px;text-align:center;
    font-size:28px;font-weight:700;letter-spacing:.34em;color:#6b8199}
</style></head><body>
<div class="glow"></div>
<div class="obj">
  <svg width="1000" height="430" viewBox="0 0 1000 430" fill="none">
    <!-- 말풍선: 문구가 가려지지 않도록 방패는 오른쪽 모서리만 겹친다 -->
    <path d="M36 26h610c19.9 0 36 16.1 36 36v226c0 19.9-16.1 36-36 36H214l-92 72 13-72H36c-19.9 0-36-16.1-36-36V62c0-19.9 16.1-36 36-36z"
          fill="#ffffff" stroke="#9fc4e8" stroke-width="5"/>
    <text x="74" y="126" fill="#5b6b7f" font-size="44" font-weight="500">시간 될 때 가볍게</text>
    <text x="74" y="194" fill="#5b6b7f" font-size="44" font-weight="500">한번만 봐주세요.</text>
    <text x="74" y="272" fill="#e54900" font-size="52" font-weight="900">급한 건 아닙니다!</text>
    <!-- 방패 -->
    <g transform="translate(596 44)">
      <path d="M154 0l150 53v118c0 92-60 172-150 195C64 343 4 263 4 171V53z" fill="#ff5e00"/>
      <path d="M154 0l150 53v118c0 92-60 172-150 195C64 343 4 263 4 171V53z" fill="none" stroke="#dceeff" stroke-width="16"/>
      <g fill="#dceeff">
        <rect x="48" y="118" width="86" height="36" rx="9"/><rect x="152" y="118" width="104" height="36" rx="9"/>
        <rect x="48" y="176" width="126" height="36" rx="9"/><rect x="192" y="176" width="64" height="36" rx="9"/>
        <rect x="48" y="234" width="58" height="36" rx="9"/><rect x="124" y="234" width="132" height="36" rx="9"/>
      </g>
    </g>
  </svg>
</div>
<div class="key">메시지 위험도 진단</div>
<div class="brand">OFFICE FIREWALL</div>
</body></html>
